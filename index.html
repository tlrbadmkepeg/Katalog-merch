<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Katalog Merchandise</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f4f4;}
    header{
      position:sticky;top:0;z-index:10;
      background:#fff;border-bottom:1px solid #e6e6e6;
      padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    }
    button{padding:8px 10px;border:1px solid #ddd;background:#fff;border-radius:10px;cursor:pointer}
    .wrap{max-width:1200px;margin:0 auto;padding:14px;}
    #book{
      width:min(1100px, 96vw);
      height:min(720px, 80vh);
      margin:0 auto;
      background:#fff;
      border:1px solid #e5e5e5;
      border-radius:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }
    .hint{font-size:13px;color:#666;margin-top:10px;text-align:center}
  </style>
</head>
<body>

<header>
  <button id="prev">◀ Prev</button>
  <button id="next">Next ▶</button>
  <span id="status">Loading…</span>
</header>

<div class="wrap">
  <div id="book"></div>
  <div class="hint">Balik halaman pakai jari (drag/swipe). Landscape biasanya tampil 2 halaman.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
  // ✅ UBAH sesuai jumlah file kamu (misal 23 halaman)
  const TOTAL_PAGES = 23;

  function pad3(n){ return String(n).padStart(3,'0'); }

  const pages = [];
  for (let i = 1; i <= TOTAL_PAGES; i++){
    pages.push(`pages/page-${pad3(i)}.jpg`);
  }

  const bookEl = document.getElementById('book');
  const statusEl = document.getElementById('status');

  const pageFlip = new St.PageFlip(bookEl, {
    width: 550,
    height: 720,
    size: "stretch",
    minWidth: 320,
    maxWidth: 1100,
    minHeight: 420,
    maxHeight: 800,
    maxShadowOpacity: 0.35,
    showCover: false,
    mobileScrollSupport: false
  });

  pageFlip.loadFromImages(pages);

  function updateStatus(){
    const p = pageFlip.getCurrentPageIndex() + 1;
    statusEl.textContent = `Halaman ${p} / ${TOTAL_PAGES}`;
  }

  pageFlip.on("flip", updateStatus);
  setTimeout(updateStatus, 400);

  document.getElementById('prev').onclick = () => pageFlip.flipPrev();
  document.getElementById('next').onclick = () => pageFlip.flipNext();
</script>

</body>
</html>
